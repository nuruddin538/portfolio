<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fitlog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow-fit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-fitlog)"/>
  
  <circle cx="1000" cy="150" r="180" fill="#f97316" fill-opacity="0.07" />
  <circle cx="180" cy="500" r="220" fill="#06b6d4" fill-opacity="0.06" />

  <!-- Navbar -->
  <rect x="60" y="40" width="1080" height="70" rx="16" fill="#27272a" fill-opacity="0.95" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="90" y="58" width="34" height="34" rx="8" fill="url(#orange-glow)" />
  <text x="135" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Fit-Log</text>
  <text x="220" y="80" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Fitness Tracking &amp; Workout Dashboard</text>

  <!-- Streak indicator -->
  <rect x="910" y="55" width="200" height="40" rx="10" fill="#3f3f46" stroke="#f97316" stroke-width="1"/>
  <text x="930" y="80" fill="#fb923c" font-size="16">🔥</text>
  <text x="955" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">14-Day Workout Streak</text>

  <!-- KPI Metrics Row -->
  <g transform="translate(60, 130)">
    <!-- KPI 1 -->
    <rect width="250" height="110" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="25" y="40" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Daily Active Calories</text>
    <text x="25" y="80" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">740 <tspan font-size="16" fill="#a1a1aa">kcal</tspan></text>
    <rect x="175" y="25" width="55" height="24" rx="6" fill="#431407"/>
    <text x="202" y="41" fill="#fdba74" font-size="11" text-anchor="middle">+12%</text>

    <!-- KPI 2 -->
    <g transform="translate(275, 0)">
      <rect width="250" height="110" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="25" y="40" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Workout Duration</text>
      <text x="25" y="80" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">58 <tspan font-size="16" fill="#a1a1aa">mins</tspan></text>
      <rect x="175" y="25" width="55" height="24" rx="6" fill="#083344"/>
      <text x="202" y="41" fill="#67e8f9" font-size="11" text-anchor="middle">Goal 90%</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(550, 0)">
      <rect width="250" height="110" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="25" y="40" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Exercises Logged</text>
      <text x="25" y="80" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">6 <tspan font-size="16" fill="#a1a1aa">sets</tspan></text>
      <rect x="175" y="25" width="55" height="24" rx="6" fill="#064e3b"/>
      <text x="202" y="41" fill="#6ee7b7" font-size="11" text-anchor="middle">Full Body</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(825, 0)">
      <rect width="255" height="110" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="25" y="40" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">State Architecture</text>
      <text x="25" y="78" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">React Context</text>
      <text x="25" y="98" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11">TypeScript + Tailwind CSS</text>
    </g>
  </g>

  <!-- Lower Section: Workout Log & Progression Chart -->
  <g transform="translate(60, 265)">
    <!-- Left Column: Workout Routine Cards (650px) -->
    <rect width="680" height="360" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Today's Workout Log &amp; Exercises</text>

    <!-- Exercise 1: Barbell Bench Press -->
    <g transform="translate(25, 60)" filter="url(#shadow-fit)">
      <rect width="630" height="80" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="45" cy="40" r="22" fill="#431407"/>
      <text x="45" y="46" fill="#fb923c" font-size="20" text-anchor="middle">🏋️</text>
      <text x="85" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Barbell Bench Press</text>
      <text x="85" y="55" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="12">Chest &amp; Triceps • 4 Sets x 8-10 Reps</text>
      <rect x="510" y="25" width="95" height="30" rx="8" fill="url(#orange-glow)"/>
      <text x="557" y="45" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">85 kg (PR)</text>
    </g>

    <!-- Exercise 2: Incline Dumbbell Press -->
    <g transform="translate(25, 155)" filter="url(#shadow-fit)">
      <rect width="630" height="80" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="45" cy="40" r="22" fill="#083344"/>
      <text x="45" y="46" fill="#38bdf8" font-size="20" text-anchor="middle">💪</text>
      <text x="85" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Incline Dumbbell Press</text>
      <text x="85" y="55" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="12">Upper Chest Focus • 3 Sets x 12 Reps</text>
      <rect x="510" y="25" width="95" height="30" rx="8" fill="#0891b2"/>
      <text x="557" y="45" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">30 kg / side</text>
    </g>

    <!-- Exercise 3: Cable Tricep Pushdown -->
    <g transform="translate(25, 250)" filter="url(#shadow-fit)">
      <rect width="630" height="80" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="45" cy="40" r="22" fill="#064e3b"/>
      <text x="45" y="46" fill="#34d399" font-size="20" text-anchor="middle">⚡</text>
      <text x="85" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Cable Tricep Rope Pushdown</text>
      <text x="85" y="55" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="12">Isolation Finisher • 3 Sets x 15 Reps</text>
      <rect x="510" y="25" width="95" height="30" rx="8" fill="#059669"/>
      <text x="557" y="45" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">35 kg / set</text>
    </g>

    <!-- Right Column: Visual Weekly Volume Progress Chart (380px) -->
    <g transform="translate(700, 0)">
      <rect width="380" height="360" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
      <text x="25" y="40" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">Weekly Volume Trends</text>
      <text x="25" y="65" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="12">Consistent overload tracking</text>

      <!-- Bar Graph -->
      <g transform="translate(30, 90)">
        <!-- Mon -->
        <rect x="0" y="80" width="36" height="140" rx="6" fill="#3f3f46"/>
        <text x="18" y="240" fill="#71717a" font-size="11" text-anchor="middle">M</text>

        <!-- Tue -->
        <rect x="46" y="40" width="36" height="180" rx="6" fill="url(#orange-glow)"/>
        <text x="64" y="240" fill="#fb923c" font-size="11" font-weight="700" text-anchor="middle">T</text>

        <!-- Wed -->
        <rect x="92" y="100" width="36" height="120" rx="6" fill="#3f3f46"/>
        <text x="110" y="240" fill="#71717a" font-size="11" text-anchor="middle">W</text>

        <!-- Thu -->
        <rect x="138" y="30" width="36" height="190" rx="6" fill="url(#orange-glow)"/>
        <text x="156" y="240" fill="#fb923c" font-size="11" font-weight="700" text-anchor="middle">T</text>

        <!-- Fri -->
        <rect x="184" y="60" width="36" height="160" rx="6" fill="url(#cyan-accent)"/>
        <text x="202" y="240" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">F</text>

        <!-- Sat -->
        <rect x="230" y="20" width="36" height="200" rx="6" fill="url(#orange-glow)"/>
        <text x="248" y="240" fill="#fb923c" font-size="11" font-weight="700" text-anchor="middle">S</text>

        <!-- Sun -->
        <rect x="276" y="150" width="36" height="70" rx="6" fill="#27272a"/>
        <text x="294" y="240" fill="#71717a" font-size="11" text-anchor="middle">S</text>
      </g>

      <!-- Bottom badge -->
      <rect x="25" y="300" width="330" height="35" rx="8" fill="#27272a"/>
      <text x="190" y="322" fill="#a1a1aa" font-size="12" text-anchor="middle">⚡ Total Volume: 14,820 kg lifted this week</text>
    </g>
  </g>
</svg>
