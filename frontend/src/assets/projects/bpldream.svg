<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bpl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="crimson-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow-bpl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-bpl)"/>
  
  <circle cx="1000" cy="120" r="190" fill="#f43f5e" fill-opacity="0.08" />
  <circle cx="180" cy="500" r="220" fill="#fbbf24" fill-opacity="0.06" />

  <!-- Navbar -->
  <rect x="60" y="40" width="1080" height="70" rx="16" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
  <rect x="90" y="58" width="34" height="34" rx="8" fill="url(#crimson-glow)" />
  <text x="135" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">BPL Dream 🏏</text>
  <text x="270" y="80" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Bangladesh Premier League Player &amp; Squad Hub</text>

  <!-- Navigation items -->
  <text x="690" y="80" fill="#ffffff" font-size="13" font-weight="700">Home</text>
  <text x="760" y="80" fill="#94a3b8" font-size="13">Fixtures</text>
  <text x="840" y="80" fill="#94a3b8" font-size="13">Players</text>
  <text x="910" y="80" fill="#94a3b8" font-size="13">Teams</text>

  <rect x="980" y="55" width="130" height="40" rx="10" fill="url(#gold-glow)"/>
  <text x="1005" y="80" fill="#0f172a" font-size="13" font-weight="800">My Dream XI</text>

  <!-- Banner: Live Match Score Header -->
  <g transform="translate(60, 130)">
    <rect width="1080" height="100" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Team 1: Chattogram Challengers -->
    <rect x="30" y="25" width="48" height="48" rx="12" fill="#be123c"/>
    <text x="54" y="55" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">CC</text>
    <text x="90" y="45" fill="#ffffff" font-size="18" font-weight="800">Chattogram Challengers</text>
    <text x="90" y="68" fill="#fda4af" font-size="14" font-weight="700">186/4 <tspan font-size="12" fill="#94a3b8">(20.0 Overs)</tspan></text>

    <!-- VS Badge -->
    <circle cx="540" cy="50" r="22" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="540" y="55" fill="#f43f5e" font-size="12" font-weight="900" text-anchor="middle">VS</text>

    <!-- Team 2: Fortune Barishal -->
    <rect x="670" y="25" width="48" height="48" rx="12" fill="#065f46"/>
    <text x="694" y="55" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">FB</text>
    <text x="730" y="45" fill="#ffffff" font-size="18" font-weight="800">Fortune Barishal</text>
    <text x="730" y="68" fill="#a7f3d0" font-size="14" font-weight="700">182/7 <tspan font-size="12" fill="#94a3b8">(Target 187)</tspan></text>

    <!-- Match Result Tag -->
    <rect x="940" y="35" width="110" height="30" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="995" y="55" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">CC won by 4 runs</text>
  </g>

  <!-- Player Cards Row -->
  <g transform="translate(60, 255)">
    <!-- Player 1: Shakib Al Hasan -->
    <g filter="url(#shadow-bpl)">
      <rect width="250" height="360" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="15" y="15" width="220" height="150" rx="12" fill="#0f172a"/>
      <circle cx="125" cy="85" r="45" fill="#047857" fill-opacity="0.3"/>
      <text x="125" y="98" fill="#34d399" font-size="36" text-anchor="middle">🏏</text>
      <rect x="25" y="25" width="80" height="22" rx="6" fill="#064e3b"/>
      <text x="65" y="40" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">All-Rounder</text>

      <text x="20" y="195" fill="#ffffff" font-size="17" font-weight="800">Shakib Al Hasan</text>
      <text x="20" y="218" fill="#94a3b8" font-size="12">Batting: LHB • Bowling: SLA</text>

      <rect x="20" y="235" width="210" height="48" rx="8" fill="#0f172a"/>
      <text x="35" y="255" fill="#64748b" font-size="11">Runs: 420</text>
      <text x="35" y="272" fill="#64748b" font-size="11">SR: 144.8</text>
      <text x="130" y="255" fill="#64748b" font-size="11">Wickets: 18</text>
      <text x="130" y="272" fill="#64748b" font-size="11">Econ: 6.8</text>

      <rect x="20" y="300" width="210" height="40" rx="10" fill="url(#crimson-glow)"/>
      <text x="125" y="325" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Select for Dream XI</text>
    </g>

    <!-- Player 2: Tamim Iqbal -->
    <g transform="translate(275, 0)" filter="url(#shadow-bpl)">
      <rect width="250" height="360" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="15" y="15" width="220" height="150" rx="12" fill="#0f172a"/>
      <circle cx="125" cy="85" r="45" fill="#1e3a8a" fill-opacity="0.3"/>
      <text x="125" y="98" fill="#60a5fa" font-size="36" text-anchor="middle">🧢</text>
      <rect x="25" y="25" width="80" height="22" rx="6" fill="#1e3a8a"/>
      <text x="65" y="40" fill="#bfdbfe" font-size="11" font-weight="700" text-anchor="middle">Top Order</text>

      <text x="20" y="195" fill="#ffffff" font-size="17" font-weight="800">Tamim Iqbal (C)</text>
      <text x="20" y="218" fill="#94a3b8" font-size="12">Left-Hand Opening Batter</text>

      <rect x="20" y="235" width="210" height="48" rx="8" fill="#0f172a"/>
      <text x="35" y="255" fill="#64748b" font-size="11">Runs: 492 (Top)</text>
      <text x="35" y="272" fill="#64748b" font-size="11">Avg: 38.6</text>
      <text x="140" y="255" fill="#64748b" font-size="11">50s: 4</text>
      <text x="140" y="272" fill="#64748b" font-size="11">HS: 86*</text>

      <rect x="20" y="300" width="210" height="40" rx="10" fill="#334155"/>
      <text x="125" y="325" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">View Player Stats</text>
    </g>

    <!-- Player 3: Mustafizur Rahman -->
    <g transform="translate(550, 0)" filter="url(#shadow-bpl)">
      <rect width="250" height="360" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="15" y="15" width="220" height="150" rx="12" fill="#0f172a"/>
      <circle cx="125" cy="85" r="45" fill="#78350f" fill-opacity="0.3"/>
      <text x="125" y="98" fill="#fbbf24" font-size="36" text-anchor="middle">🎯</text>
      <rect x="25" y="25" width="80" height="22" rx="6" fill="#78350f"/>
      <text x="65" y="40" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">Fast Bowler</text>

      <text x="20" y="195" fill="#ffffff" font-size="17" font-weight="800">Mustafizur Rahman</text>
      <text x="20" y="218" fill="#94a3b8" font-size="12">Left-Arm Fast-Medium Cutter</text>

      <rect x="20" y="235" width="210" height="48" rx="8" fill="#0f172a"/>
      <text x="35" y="255" fill="#64748b" font-size="11">Wickets: 22</text>
      <text x="35" y="272" fill="#64748b" font-size="11">Econ: 6.45</text>
      <text x="135" y="255" fill="#64748b" font-size="11">Best: 5/21</text>
      <text x="135" y="272" fill="#64748b" font-size="11">Dots: 124</text>

      <rect x="20" y="300" width="210" height="40" rx="10" fill="url(#crimson-glow)"/>
      <text x="125" y="325" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Select for Dream XI</text>
    </g>

    <!-- Player 4: Towhid Hridoy -->
    <g transform="translate(825, 0)" filter="url(#shadow-bpl)">
      <rect width="255" height="360" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="15" y="15" width="225" height="150" rx="12" fill="#0f172a"/>
      <circle cx="127" cy="85" r="45" fill="#831843" fill-opacity="0.3"/>
      <text x="127" y="98" fill="#f472b6" font-size="36" text-anchor="middle">🔥</text>
      <rect x="25" y="25" width="80" height="22" rx="6" fill="#831843"/>
      <text x="65" y="40" fill="#fbcfe8" font-size="11" font-weight="700" text-anchor="middle">Middle Order</text>

      <text x="20" y="195" fill="#ffffff" font-size="17" font-weight="800">Towhid Hridoy</text>
      <text x="20" y="218" fill="#94a3b8" font-size="12">Right-Hand Aggressive Batter</text>

      <rect x="20" y="235" width="215" height="48" rx="8" fill="#0f172a"/>
      <text x="35" y="255" fill="#64748b" font-size="11">Runs: 385</text>
      <text x="35" y="272" fill="#64748b" font-size="11">SR: 152.4</text>
      <text x="135" y="255" fill="#64748b" font-size="11">Sixes: 21</text>
      <text x="135" y="272" fill="#64748b" font-size="11">50s: 3</text>

      <rect x="20" y="300" width="215" height="40" rx="10" fill="#334155"/>
      <text x="127" y="325" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">View Player Stats</text>
    </g>
  </g>
</svg>
