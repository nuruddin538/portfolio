<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-devstack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow-dev" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-devstack)"/>
  
  <!-- Glowing orbs -->
  <circle cx="200" cy="180" r="160" fill="#6366f1" fill-opacity="0.08" />
  <circle cx="1020" cy="480" r="220" fill="#8b5cf6" fill-opacity="0.08" />

  <!-- Navbar -->
  <rect x="60" y="40" width="1080" height="70" rx="16" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
  <rect x="90" y="58" width="34" height="34" rx="8" fill="url(#purple-glow)" />
  <text x="135" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">DevStack</text>
  <text x="240" y="80" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Technology Stack Builder &amp; Architect</text>

  <!-- Selected Stack Counter Badge -->
  <rect x="920" y="55" width="190" height="40" rx="10" fill="url(#purple-glow)"/>
  <text x="960" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Active Stack: 6 Tools</text>

  <!-- Left Sidebar: Selected Stacks / Export (320px) -->
  <g transform="translate(60, 135)" filter="url(#shadow-dev)">
    <rect width="320" height="490" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">My Customized Stack</text>
    <text x="25" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Type-Safe Architecture Configuration</text>

    <!-- Item 1 -->
    <rect x="20" y="90" width="280" height="55" rx="10" fill="#0f172a" stroke="#3730a3" stroke-width="1.2"/>
    <circle cx="48" cy="117" r="14" fill="#0284c7" fill-opacity="0.3"/>
    <text x="48" y="122" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" text-anchor="middle">⚛</text>
    <text x="75" y="114" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">React 19</text>
    <text x="75" y="132" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Frontend Core • Component UI</text>

    <!-- Item 2 -->
    <rect x="20" y="155" width="280" height="55" rx="10" fill="#0f172a" stroke="#3730a3" stroke-width="1.2"/>
    <circle cx="48" cy="182" r="14" fill="#2563eb" fill-opacity="0.3"/>
    <text x="48" y="187" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">TS</text>
    <text x="75" y="179" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">TypeScript</text>
    <text x="75" y="197" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11">Type Safety &amp; Generics</text>

    <!-- Item 3 -->
    <rect x="20" y="220" width="280" height="55" rx="10" fill="#0f172a" stroke="#3730a3" stroke-width="1.2"/>
    <circle cx="48" cy="247" r="14" fill="#0d9488" fill-opacity="0.3"/>
    <text x="48" y="252" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="16" text-anchor="middle">🌊</text>
    <text x="75" y="244" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Tailwind CSS v4</text>
    <text x="75" y="262" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="11">Utility-First Design System</text>

    <!-- Item 4 -->
    <rect x="20" y="285" width="280" height="55" rx="10" fill="#0f172a" stroke="#3730a3" stroke-width="1.2"/>
    <circle cx="48" cy="312" r="14" fill="#7c3aed" fill-opacity="0.3"/>
    <text x="48" y="317" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="16" text-anchor="middle">⚡</text>
    <text x="75" y="309" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Vite Bundler</text>
    <text x="75" y="327" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11">Ultra-fast Dev &amp; HMR</text>

    <!-- Export Button -->
    <rect x="20" y="420" width="280" height="45" rx="12" fill="url(#purple-glow)"/>
    <text x="160" y="448" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Export Stack as Config</text>
  </g>

  <!-- Right Section: Available Tech Cards Grid (730px) -->
  <g transform="translate(410, 135)">
    <!-- Category Tabs -->
    <rect x="0" y="0" width="730" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="8" width="110" height="34" rx="8" fill="url(#purple-glow)"/>
    <text x="65" y="30" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">All Tech (24)</text>
    
    <text x="180" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Frontend</text>
    <text x="270" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Backend</text>
    <text x="360" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Database</text>
    <text x="450" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">DevOps &amp; Cloud</text>

    <!-- Grid of selectable tech cards -->
    <!-- Card 1: Next.js -->
    <g transform="translate(0, 70)" filter="url(#shadow-dev)">
      <rect width="225" height="195" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.8"/>
      <circle cx="195" cy="30" r="10" fill="#6366f1"/>
      <text x="195" y="34" fill="#ffffff" font-size="11" text-anchor="middle">✓</text>
      <text x="20" y="50" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="30">▲</text>
      <text x="20" y="90" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">Next.js 15</text>
      <text x="20" y="112" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Full-Stack Framework</text>
      <text x="20" y="140" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">App Router, SSR, Server Actions &amp; Turbopack.</text>
      <rect x="20" y="155" width="70" height="20" rx="4" fill="#312e81"/>
      <text x="28" y="169" fill="#c7d2fe" font-size="10">SSR / Edge</text>
    </g>

    <!-- Card 2: MongoDB -->
    <g transform="translate(250, 70)" filter="url(#shadow-dev)">
      <rect width="225" height="195" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="50" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="30">🍃</text>
      <text x="20" y="90" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">MongoDB</text>
      <text x="20" y="112" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12">NoSQL Database</text>
      <text x="20" y="140" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Document storage with Mongoose ODM schemas.</text>
      <rect x="20" y="155" width="80" height="20" rx="4" fill="#064e3b"/>
      <text x="28" y="169" fill="#a7f3d0" font-size="10">Mongoose</text>
    </g>

    <!-- Card 3: Better Auth -->
    <g transform="translate(500, 70)" filter="url(#shadow-dev)">
      <rect width="225" height="195" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="50" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="30">🔐</text>
      <text x="20" y="90" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">Better Auth</text>
      <text x="20" y="112" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Modern Authentication</text>
      <text x="20" y="140" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Sessions, OAuth, multi-factor &amp; user profiles.</text>
      <rect x="20" y="155" width="75" height="20" rx="4" fill="#075985"/>
      <text x="28" y="169" fill="#bae6fd" font-size="10">Protected</text>
    </g>

    <!-- Card 4: Node.js & Express -->
    <g transform="translate(0, 285)" filter="url(#shadow-dev)">
      <rect width="225" height="195" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="325" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="30">⚡</text>
      <text x="20" y="365" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">Node / Express</text>
      <text x="20" y="387" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="12">Backend &amp; REST APIs</text>
      <text x="20" y="415" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Middleware architecture, asynchronous routes.</text>
      <rect x="20" y="430" width="80" height="20" rx="4" fill="#14532d"/>
      <text x="28" y="444" fill="#bbf7d0" font-size="10">REST API</text>
    </g>

    <!-- Card 5: Vercel & Netlify -->
    <g transform="translate(250, 285)" filter="url(#shadow-dev)">
      <rect width="225" height="195" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="325" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="30">🚀</text>
      <text x="20" y="365" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">Vercel &amp; Netlify</text>
      <text x="20" y="387" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="12">Edge Cloud Deployment</text>
      <text x="20" y="415" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Automated CI/CD pipelines &amp; custom domains.</text>
      <rect x="20" y="430" width="70" height="20" rx="4" fill="#881337"/>
      <text x="28" y="444" fill="#fecdd3" font-size="10">Live CI/CD</text>
    </g>

    <!-- Card 6: AI-Assisted Tooling -->
    <g transform="translate(500, 285)" filter="url(#shadow-dev)">
      <rect width="225" height="195" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8"/>
      <circle cx="195" cy="30" r="10" fill="#8b5cf6"/>
      <text x="195" y="34" fill="#ffffff" font-size="11" text-anchor="middle">✓</text>
      <text x="20" y="325" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="30">🤖</text>
      <text x="20" y="365" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">AI Coding Workflow</text>
      <text x="20" y="387" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="12">Prompt &amp; Debugging Tools</text>
      <text x="20" y="415" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">AI-assisted implementation &amp; speed boost.</text>
      <rect x="20" y="430" width="75" height="20" rx="4" fill="#581c87"/>
      <text x="28" y="444" fill="#e9d5ff" font-size="10">AI-Powered</text>
    </g>
  </g>
</svg>
